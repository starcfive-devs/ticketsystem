<!doctype html>
<html lang="en">
<head>
  <!-- Keep text encoding consistent for event names, currency, and symbols. -->
  <meta charset="utf-8">
  <!-- Make the liquid-glass layout responsive on phones, tablets, and desktops. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Describe the event discovery and ticket booking experience for search engines. -->
  <meta name="description" content="Discover memorable events across Ghana and find your next experience.">
  <!-- Coordinate browser chrome with the site's dark crystal-glass theme. -->
  <meta name="theme-color" content="#080d16">
  <!-- Load the main stylesheet that defines the shared liquid-glass design system. -->
  <link rel="stylesheet" href="styles.css">
  <!-- Add the refined clear-crystal liquid-glass finish above the base design. -->
  <link rel="stylesheet" href="liquid-glass.css">
  <!-- Load the icon library used by navigation, event cards, and actions. -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Load the interaction layer after the document has been parsed. -->
  <script src="script.js" defer></script>
  <title>Events &amp; Tickets — Discover What's Next</title>
</head>
<body>
  <header class="topbar">
    <button class="menu-button glass-control" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sideMenu">
      <span class="menu-lines" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <form class="search-box glass-surface" id="searchForm" role="search">
      <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
      <input id="eventSearch" type="search" placeholder="Search events, places, experiences..." aria-label="Search events">
      <kbd>/</kbd>
      <button type="submit" aria-label="Search"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    </form>
    <div class="top-actions">
      <button class="icon-button glass-control" id="notificationsButton" type="button" aria-label="Notifications" title="Notifications" aria-expanded="false">
        <i class="fa-regular fa-bell" aria-hidden="true"></i><span class="notification-dot" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <main class="page-shell">
    <footer class="footer">
      <a class="brand footer-brand" href="#" aria-label="Gather home"><span class="brand-mark"><i class="fa-solid fa-ticket" aria-hidden="true"></i></span><span class="brand-word">gather<span>.</span></span></a>
      <p>Find your people. Make the moment count.</p>
      <div class="footer-links"><a href="#">Discover</a><button type="button" id="footerAbout">About</button><a href="#">For organizers</a></div>
      <span class="demo-note"><span class="status-pulse"></span> PREVIEW EXPERIENCE</span>
      <small class="copyright">© 2026 Gather. Made for moments that matter.</small>
    </footer>
  </main>
</body>
</html>

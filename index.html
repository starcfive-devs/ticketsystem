<!doctype html>
<html lang="en">
<head>
  <!-- Keep text encoding consistent for event names, currency, and symbols. -->
  <meta charset="utf-8">
  <!-- Make the liquid-glass layout responsive on phones, tablets, and desktops. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Describe the event discovery and ticket booking experience for search engines. -->
  <meta name="description" content="Discover memorable events across Ghana and find your next experience.">
  <!-- Coordinate browser chrome with the site's dark crystal-glass theme. -->
  <meta name="theme-color" content="#080d16">
  <!-- Load the main stylesheet that defines the shared liquid-glass design system. -->
  <link rel="stylesheet" href="styles.css">
  <!-- Add the refined clear-crystal liquid-glass finish above the base design. -->
  <link rel="stylesheet" href="liquid-glass.css">
  <!-- Load the icon library used by navigation, event cards, and actions. -->
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <!-- Load the interaction layer after the document has been parsed. -->
  <script src="script.js" defer></script>
  <title>Events &amp; Tickets</title>
</head>
<body>
  <header class="topbar">
    <button class="menu-button glass-control" id="menuButton" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="sideMenu">
      <span class="menu-lines" aria-hidden="true"><i></i><i></i><i></i></span>
    </button>
    <form class="search-box glass-surface" id="searchForm" role="search">
      <i class="fa-solid fa-magnifying-glass search-icon" aria-hidden="true"></i>
      <input id="eventSearch" type="search" placeholder="Search events, places, experiences..." aria-label="Search events">
      <kbd>/</kbd>
      <button type="submit" aria-label="Search"><i class="fa-solid fa-arrow-right" aria-hidden="true"></i></button>
    </form>
    <div class="top-actions">
      <button class="icon-button glass-control" id="notificationsButton" type="button" aria-label="Notifications" title="Notifications" aria-expanded="false">
        <i class="fa-regular fa-bell" aria-hidden="true"></i><span class="notification-dot" aria-hidden="true"></span>
      </button>
    </div>
  </header>

  <!-- Functional menu opened by the header button. -->
  <aside class="side-menu glass-panel" id="sideMenu" aria-hidden="true">
    <div class="side-menu-heading">
      <span class="menu-heading-mark"><i class="fa-solid fa-ticket" aria-hidden="true"></i></span>
      <div><strong>Navigation</strong><small>Choose where you want to go.</small></div>
      <button class="menu-close glass-control" id="closeMenu" type="button" aria-label="Close menu"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    </div>
    <span class="menu-label">DISCOVER</span>
    <button type="button" data-menu-view="home"><i class="fa-solid fa-house" aria-hidden="true"></i> Home</button>
    <button type="button" data-menu-view="categories"><i class="fa-solid fa-compass" aria-hidden="true"></i> Explore events</button>
    <button type="button" data-menu-view="saved"><i class="fa-regular fa-heart" aria-hidden="true"></i> Saved events</button>
    <span class="menu-label menu-label-spaced">YOUR SPACE</span>
    <button type="button" data-menu-view="account"><i class="fa-regular fa-user" aria-hidden="true"></i> Account</button>
    <button type="button" data-menu-view="about"><i class="fa-regular fa-circle-question" aria-hidden="true"></i> About this site</button>
    <div class="menu-bottom-note"><span class="status-pulse"></span> Made for moments that matter</div>
  </aside>
  <button class="menu-scrim" id="menuScrim" type="button" aria-label="Close menu" tabindex="-1"></button>

  <!-- Functional notifications popover opened by the header bell. -->
  <section class="notification-panel glass-panel" id="notificationPanel" aria-hidden="true" aria-labelledby="notificationTitle">
    <div class="notification-panel-heading"><div><span class="eyebrow">YOUR UPDATES</span><strong id="notificationTitle">Notifications</strong></div><button class="notification-close glass-control" id="closeNotifications" type="button" aria-label="Close notifications"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
    <div class="notification-panel-content"><span class="notification-panel-icon"><i class="fa-regular fa-bell" aria-hidden="true"></i></span><p>You’re all caught up.</p><small>Event announcements and booking updates will appear here.</small></div>
  </section>

  <!-- Informational dialog used by the footer About link and menu actions. -->
  <dialog class="message-dialog glass-dialog" id="messageDialog">
    <form method="dialog" class="dialog-close-form"><button class="icon-button glass-control dialog-close" aria-label="Close message"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></form>
    <div class="message-dialog-inner"><span class="message-icon"><i class="fa-regular fa-calendar-check" aria-hidden="true"></i></span><span class="eyebrow">EVENT INFORMATION</span><h2 id="messageTitle">About Gather</h2><p id="messageBody"></p><button class="primary-button" type="button" id="messageOk">Got it</button></div>
  </dialog>

  <main class="page-shell">

  </main>

  <!-- Persistent bottom navigation for the main app actions. -->
  <nav class="mobile-nav" aria-label="Main navigation">
    <button class="mobile-nav-link active" type="button" data-nav-action="home" aria-current="page"><i class="fa-solid fa-house" aria-hidden="true"></i><span>Home</span></button>
    <button class="mobile-nav-link" type="button" data-nav-action="explore"><i class="fa-regular fa-compass" aria-hidden="true"></i><span>Explore</span></button>
    <button class="mobile-add" type="button" data-nav-action="create" aria-label="Create an event"><i class="fa-solid fa-plus" aria-hidden="true"></i></button>
    <button class="mobile-nav-link" type="button" data-nav-action="tickets"><i class="fa-solid fa-ticket" aria-hidden="true"></i><span>Tickets</span></button>
    <button class="mobile-nav-link" type="button" data-nav-action="profile"><i class="fa-regular fa-user" aria-hidden="true"></i><span>Profile</span></button>
  </nav>
</body>
</html>
